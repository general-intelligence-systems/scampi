<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scampi</title>

  <!-- Markdown + syntax highlighting, all from CDN, no build step -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/ruby.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/bash.min.js"></script>

  <style>
    :root { --fg: #1f2328; --muted: #59636e; --border: #d1d9e0; --link: #0969da; --code-bg: #f6f8fa; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e6edf3; --muted: #9198a1; --border: #3d444d; --link: #4493f8; --code-bg: #151b23; }
      body { background: #0d1117; }
    }
    * { box-sizing: border-box; }
    body {
      color: var(--fg);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      max-width: 820px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 6rem;
    }
    .banner {
      display: block;
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 2.5rem;
    }
    h1, h2, h3 { line-height: 1.25; margin-top: 1.75em; }
    h1 { font-size: 2rem; }
    h1:first-child { margin-top: 0; }
    h2 { border-bottom: 1px solid var(--border); padding-bottom: .3em; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code {
      background: var(--code-bg);
      padding: .2em .4em;
      border-radius: 6px;
      font-size: 85%;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    pre {
      background: var(--code-bg);
      padding: 1rem;
      border-radius: 8px;
      overflow: auto;
    }
    pre code { background: none; padding: 0; font-size: 87.5%; }
    blockquote { color: var(--muted); border-left: .25em solid var(--border); margin: 0; padding: 0 1em; }
    table { border-collapse: collapse; }
    td, th { border: 1px solid var(--border); padding: 6px 13px; }
  </style>
</head>
<body>
  <img class="banner" src="media/scampi.jpeg" alt="Scampi">
  <main id="content">Loading…</main>

  <script>
    fetch("README.md")
      .then(r => r.ok ? r.text() : Promise.reject(r.status))
      .then(md => {
        document.getElementById("content").innerHTML = marked.parse(md);
        document.querySelectorAll("pre code").forEach(el => hljs.highlightElement(el));
        document.title = document.querySelector("h1")?.textContent || "Scampi";
      })
      .catch(err => {
        document.getElementById("content").textContent = "Failed to load README.md (" + err + ")";
      });
  </script>
</body>
</html>
